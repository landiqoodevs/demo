<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Landiqoo Estates</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f7f6f2;color:#101114}
main{max-width:760px;margin:auto;padding:20px}h2{font-family:Georgia,serif;margin:.3em 0}
header{background:#101114;color:#f7f6f2;padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}header b{color:#C7A76C;margin-right:auto;font-family:Georgia,serif;font-size:1.2rem}
button,.b{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid #C7A76C;background:#fff;font:600 .95rem inherit;cursor:pointer;color:#101114;text-decoration:none;display:inline-flex;align-items:center}
.g{background:#C7A76C}.d{border-color:#b3261e;color:#b3261e}header button,header .b{background:none;color:#f7f6f2}
.demo{background:#fff6dc;border:1px solid #e6d29a;border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:12px}
label{display:block;margin:14px 0 4px;font-size:.85rem;font-weight:600}input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #c9c6bb;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:90px}input[type=checkbox]{width:22px;min-height:22px}.ck{display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:400}
.am{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.row{background:#fff;border:1px solid #e0ddd2;border-radius:14px;padding:14px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row div{flex:1;min-width:180px}.row small{color:#666}.pill{font-size:.7rem;padding:2px 8px;border-radius:99px;background:#e6e2d4}
.th{display:flex;gap:8px;flex-wrap:wrap}.th div{position:relative}.th img{width:96px;height:72px;object-fit:cover;border-radius:8px;display:block}.th button{min-height:32px;padding:0 8px;font-size:.8rem}
#msg{position:sticky;bottom:0;padding:12px;margin-top:12px;border-radius:10px;background:#fff}.err{color:#b3261e}.ok{color:#1b6b3a}.hint{font-size:.85rem;color:#555}
</style></head><body>
<header><b>Landiqoo Admin</b><button data-v="list">Properties</button><button data-v="st">Broker details</button><a class="b" href="index.html">View website</a></header>
<main><p class="demo"><b>Demo mode.</b> Anything you add here is saved in this browser only and shows on the website on this same device. Nothing is sent to a server.</p>
<div id="list"></div><form id="f" hidden></form><form id="st" hidden></form><p id="msg"></p></main>
<script>
const $=s=>document.querySelector(s);
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open("lq_demo",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const r=d.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const idbSet=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const seed=async f=>{try{const r=await fetch(f);return r.ok?await r.json():null}catch(e){return null}};
const src=x=>x instanceof Blob?URL.createObjectURL(x):x;
async function shrink(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.82))}
const AM={pool:"Swimming pool",gym:"Gym",park:"Covered parking",garden:"Private garden",sec:"24×7 security",club:"Clubhouse",power:"Power backup",school:"Nearby schools",hosp:"Nearby hospitals",theatre:"Home theatre",lift:"High-speed lifts"};
const KIND={villa:"Luxury Villa",apt:"Premium Apartment",house:"Independent House"},PAL={villa:["#1b2838","#c7a76c"],apt:["#241f33","#d9b98a"],house:["#2c3a2f","#e0c58f"]},STAT=["Available","Few units left","Under offer","Sold"];
const DET=["Architecture","Interiors","Construction","Neighbourhood","Nearby","Highlights"];
const TXT=[["name","Property name *"],["loc","Location (area, city) *"],["full","Full address"],["price","Price (e.g. ₹2.10 Cr)"],["area","Total area (sq ft)"],["park","Parking (e.g. 2 cars)"],["beds","Bedrooms","number"],["baths","Bathrooms","number"],["lat","Map latitude (e.g. 12.9716)","number"],["lng","Map longitude (e.g. 77.5946)","number"]];
const SET=[["phone","Phone for dialer (e.g. +919876543210)"],["display_phone","Phone as shown (e.g. +91 98765 43210)"],["broker_name","Broker name"],["broker_title","Professional title"],["bio","Short biography","area"],["years","Years of experience","number"],["homes_sold","Homes sold","number"],["areas","Areas served"],["specialisation","Specialisation"]];
let cur,LIST=[];
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const msg=(t,e)=>{const m=$("#msg");m.textContent=t;m.className=e?"err":"ok"};
const show=v=>{["list","f","st"].forEach(x=>$("#"+x).hidden=x!==v);msg("")};
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>b.dataset.v==="st"?editSettings():show("list"));
async function load(){LIST=(await idbGet("props"))||(await seed("data/properties.json"))||[];
 $("#list").innerHTML=`<h2>Your properties</h2><p class="row" style="border:0;background:none;padding:0"><button class="g" id="add">+ Add property</button><button id="rs">Reset demo data</button></p>`+(LIST.map(r=>`<div class="row"><div><b>${esc(r.name)}</b><br><small>${esc(r.loc)} · ${esc(r.price)}</small><br><span class="pill">${r.published===false?"Hidden":"Live"}</span> <span class="pill">${esc(r.status)}</span></div><button data-e="${r.id}">Edit</button><a class="b" target="_blank" href="index.html#p-${r.id}">View</a></div>`).join("")||"<p>No properties yet. Add your first one.</p>");
 $("#add").onclick=()=>edit();$("#rs").onclick=async()=>{if(confirm("Remove everything you added in this browser and restore the demo properties?")){await idbSet("props",null);await idbSet("set",null);await load();msg("Demo data restored.")}};
 $("#list").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(LIST.find(r=>r.id===b.dataset.e)));show("list")}
function thumbs(){$("#th").innerHTML=cur.images.map((u,i)=>`<div><img src="${esc(src(u))}" alt=""><button type="button" data-s="${i}" title="Make cover">★</button><button type="button" data-x="${i}" title="Remove">✕</button></div>`).join("");
 $("#th").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const[u]=cur.images.splice(+b.dataset.s,1);cur.images.unshift(u);thumbs()});
 $("#th").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{cur.images.splice(+b.dataset.x,1);thumbs()})}
function edit(r){cur=r?{...r}:{images:[],d:{},am:[],published:true,kind:"villa",status:"Available"};cur.images=[...(cur.images||[])];cur.d=cur.d||{};
 $("#f").innerHTML=`<h2>${r?"Edit":"Add"} property</h2>`+TXT.map(([n,l,t])=>`<label>${l}<input name="${n}" type="${t||"text"}" step="any" value="${esc(cur[n]==="–"?"":cur[n])}"></label>`).join("")+
 `<label>Property type<select name="kind">${Object.entries(KIND).map(([k,v])=>`<option value="${k}" ${cur.kind===k?"selected":""}>${v}</option>`).join("")}</select></label>
 <label>Availability<select name="status">${STAT.map(x=>`<option ${cur.status===x?"selected":""}>${x}</option>`).join("")}</select></label>
 <label>Short description (shown on cards)<textarea name="short">${esc(cur.short)}</textarea></label>`+
 DET.map(k=>`<label>${k}<textarea name="d_${k}">${esc(cur.d[k])}</textarea></label>`).join("")+
 `<label>Amenities</label><div class="am">${Object.entries(AM).map(([k,v])=>`<label class="ck"><input type="checkbox" name="am" value="${k}" ${(cur.am||[]).includes(k)?"checked":""}>${v}</label>`).join("")}</div>
 <label>Property video (MP4)${cur.video?" — current video kept unless you choose a new one":""}<input type="file" name="video" accept="video/*"></label>
 <label>…or paste a direct video link<input name="video_link" type="url" placeholder="https://"></label>
 <label>3D model (.glb or .gltf)${cur.model?" — current model kept unless you choose a new one":""}<input type="file" name="model" accept=".glb,.gltf"></label>
 <label>Photos (select many; they are resized automatically). First photo is the cover.</label><div class="th" id="th"></div><input type="file" name="images" accept="image/*" multiple>
 <label class="ck"><input type="checkbox" name="published" ${cur.published!==false?"checked":""}>Published (visible on the website)</label>
 <p class="row"><button class="g" id="sv">Save &amp; publish</button><button type="button" id="cn">Cancel</button>${r?'<button type="button" class="d" id="dl">Delete</button>':""}</p>`;
 thumbs();show("f");scrollTo(0,0);$("#cn").onclick=()=>show("list");
 if(r)$("#dl").onclick=async()=>{if(!confirm("Delete this property?"))return;await idbSet("props",LIST.filter(x=>x.id!==cur.id));await load();msg("Deleted.")}}
$("#f").onsubmit=async e=>{e.preventDefault();const f=e.target,b=$("#sv");b.disabled=true;
 try{const v=n=>f.elements[n].value.trim(),row={};
  TXT.forEach(([n,,t])=>{const x=v(n);row[n]=x===""?(n==="lat"||n==="lng"?null:(t==="number"?"–":"")):(t==="number"?Number(x):x)});
  if(!row.name||!row.loc)throw new Error("Name and location are required.");
  row.full=row.full||row.loc;row.price=row.price||"Price on request";row.area=row.area||"–";row.park=row.park||"–";
  row.kind=v("kind");row.type=KIND[row.kind];row.pal=cur.pal||PAL[row.kind];row.status=v("status");row.short=v("short");
  row.d=Object.fromEntries(DET.map(k=>[k,v("d_"+k)]).filter(x=>x[1]));
  row.am=[...f.querySelectorAll("[name=am]:checked")].map(x=>x.value);row.published=f.elements.published.checked;
  row.id=cur.id||slug(row.name)||"property-"+Date.now();if(!cur.id&&LIST.some(r=>r.id===row.id))row.id+="-"+Math.random().toString(36).slice(2,6);
  const vf=f.elements.video.files[0],mf=f.elements.model.files[0];
  row.video=cur.video||"";if(vf)row.video=vf;else if(v("video_link"))row.video=v("video_link");
  row.model=mf||cur.model||"";
  row.images=[...cur.images];for(const im of f.elements.images.files){msg("Processing photos…");row.images.push(await shrink(im))}
  const arr=[...LIST],ix=arr.findIndex(r=>r.id===row.id);ix>=0?arr[ix]=row:arr.unshift(row);
  await idbSet("props",arr);await load();msg("Saved — open the website to see it live.")
 }catch(x){msg(x.message||String(x),1)}b.disabled=false};
async function editSettings(){const d=(await idbGet("set"))||(await seed("data/settings.json"))||{};
 $("#st").innerHTML=`<h2>Broker details</h2><p class="hint">Updates the phone number on every INQUIRE NOW button and the broker section.</p>`+SET.map(([n,l,t])=>t==="area"?`<label>${l}<textarea name="${n}">${esc(d[n])}</textarea></label>`:`<label>${l}<input name="${n}" type="${t||"text"}" value="${esc(d[n])}"></label>`).join("")+`<p><button class="g">Save</button></p>`;show("st")}
$("#st").onsubmit=async e=>{e.preventDefault();const row={};SET.forEach(([n,,t])=>{const x=e.target.elements[n].value.trim();row[n]=x===""?null:(t==="number"?Number(x):x)});
 if(row.phone&&!/^\+?[0-9]{7,15}$/.test(row.phone))return msg("Phone must contain digits only (with optional leading +).",1);
 await idbSet("set",row);msg("Saved — the website now uses this number.")};
load().catch(x=>msg(x.message,1));
</script></body></html>
