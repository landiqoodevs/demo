  else{bx(9,.05,7.5,0,.03,0,gr);bx(4,2,3.2,0,1,0,M(0xefe3c8));const r=new THREE.Mesh(new THREE.ConeGeometry(3.3,1.6,4),M(0x9a4b32));r.rotation.y=Math.PI/4;r.scale.set(1.15,1,.95);r.position.y=2.8;G.add(r);bx(.8,1.3,.05,0,.65,1.63,M(0x5b4632));bx(.9,.7,.05,-1.2,1.1,1.63,gl);bx(.9,.7,.05,1.2,1.1,1.63,gl);bx(1.6,.04,3,0,.04,4.5,M(0x55575c));for(let a=-4;a<=4;a+=.8){bx(.06,.5,.06,a,.25,3.6,M(0x8a7459));bx(.06,.5,.06,a,.25,-3.6,M(0x8a7459))}tree(-3.2,2,1.3);tree(3.4,-1.5,1.5);tree(3,2.5,.9)}
